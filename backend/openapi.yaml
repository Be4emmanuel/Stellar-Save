          in: query
          required: true
          schema:
            type: string
        - name: receiveAsset
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sep31Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
