                initialBalance:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: Updated insurance pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePool'

  /api/v1/groups/{groupId}/insurance/claim:
    post:
      tags: [Insurance]
      summary: File an insurance claim
      operationId: insuranceClaim
      x-status: current
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimant, amount, reason]
              properties:
                claimant:
                  type: string
                  description: Stellar address of the claimant
                amount:
                  type: number
                reason:
                  type: string
