                  type: string
      responses:
        '201':
          description: Withdrawal initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RampTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: KYC approval required
        '502':
          description: Anchor service error
        '503':
          description: Circuit breaker open

  /api/ramp/{id}/status:
    get:
