      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchorDomain, sendAssetCode, receiveAssetCode, amount, receiverId]
              properties:
                anchorDomain:
                  type: string
                sendAssetCode:
                  type: string
                receiveAssetCode:
                  type: string
