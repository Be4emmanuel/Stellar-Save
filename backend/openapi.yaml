  # ── SSE Events ─────────────────────────────────────────────────────────────

  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Real-time contract event stream (SSE)
      description: |
        Opens a Server-Sent Events connection. The server pushes contract
        events as `data:` frames in real time. Sends a `connected` event on
        open and a keep-alive comment every 25 seconds.
      operationId: eventsStream
      x-status: current
      parameters:
        - name: groupId
          in: query
          schema:
            type: string
          description: Scope to a single group (omit for all events)
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated event types to filter
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

