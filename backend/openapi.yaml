openapi: 3.0.3
info:
  title: Stellar-Save Backend API
  description: |
    REST API for the Stellar-Save decentralised rotational savings platform.

    ## Authentication
    Most endpoints are public. Endpoints under `/api/user/*` require a Bearer JWT
    obtained from `POST /api/auth/verify`. Pass it as:
    ```
    Authorization: Bearer <token>
    ```

    ## Versioning
    The API is versioned via URL path prefix:
    - `/api/v1/` — stable, production-ready
    - `/api/v2/` — current development version (some routes return 501)

    Unversioned legacy paths (`/health`, `/recommendations`, etc.) are deprecated
    and will be removed on 2027-01-01.

    ## Rate Limiting
    - General endpoints: 100 req / 15 min per IP
    - Auth & admin endpoints: 10 req / 15 min per IP
    - Analytics write endpoints: stricter limits apply (see individual routes)
  version: 1.0.0
  contact:
    name: Stellar-Save
    url: https://github.com/Xoulomon/Stellar-Save

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.stellar-save.app
    description: Production

tags:
  - name: Auth
    description: Stellar wallet-based authentication
  - name: User
    description: Authenticated user profile and preferences
  - name: Health
    description: Liveness and readiness probes
  - name: Recommendations
    description: Group recommendation engine
  - name: Search
    description: Full-text and autocomplete search
  - name: Analytics
    description: Platform, user, and group analytics
  - name: Events
    description: Contract event index queries
  - name: Export
    description: Data export jobs (CSV / JSON)
  - name: Backup
    description: Database backup management
  - name: Notifications
    description: Email, push, and web-push notification management
  - name: Webhooks
    description: Outbound webhook registration and management
  - name: Cache
    description: Cache statistics and management
  - name: Stats
    description: Platform-wide statistics
  - name: Admin
    description: Internal admin dashboard endpoints (admin JWT required)
  - name: API Keys
    description: API key management for external integrators
  - name: Public API
    description: Public read-only endpoints (API key required)
  - name: Governance
    description: On-chain governance proposals and voting
  - name: Insurance
    description: Group insurance pool management
  - name: SEP-31
    description: Stellar SEP-31 cross-border payments
  - name: Fiat Ramp
    description: Fiat on/off-ramp via SEP-24 anchors
  - name: KYC
    description: Know-Your-Customer identity verification
  - name: Compliance
    description: AML transaction screening and review
  - name: Privacy
    description: GDPR/CCPA data export and deletion
  - name: Groups
    description: Savings group CRUD
  - name: IPFS
    description: IPFS pinning and metadata storage (internal)

paths:
  # ── Auth ──────────────────────────────────────────────────────────────────
  /api/auth/challenge:
    post:
      tags: [Auth]
      summary: Request a sign challenge
      description: |
        Generates a one-time challenge string the client must sign with their
        Stellar Ed25519 keypair. The challenge expires in 5 minutes.
      operationId: authChallenge
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                  description: Stellar public key (G... address)
                  example: GABC1234EXAMPLESTELLARADDRESS
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: One-time challenge string to sign
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/verify:
    post:
      tags: [Auth]
      summary: Verify signature and receive JWT
      description: |
        Verifies the Ed25519 signature against the stored challenge.
        On success, issues a signed JWT valid for 24 hours.
        The `signature` must be the base64-encoded Ed25519 signature of the
        challenge string produced by the wallet's private key.
      operationId: authVerify
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress, challenge, signature]
              properties:
                walletAddress:
                  type: string
                  example: GABC1234EXAMPLESTELLARADDRESS
                challenge:
                  type: string
                  description: The challenge string returned by /api/auth/challenge
                signature:
                  type: string
                  description: Base64-encoded Ed25519 signature of the challenge
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed JWT valid for 24 hours
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── User ──────────────────────────────────────────────────────────────────
  /api/user/me:
    get:
      tags: [User]
      summary: Get authenticated user identity
      description: Returns the wallet address extracted from the Bearer JWT.
      operationId: userMe
      x-status: current
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletAddress:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user/{walletAddress}/profile:
    get:
      tags: [User]
      summary: Get user profile
      description: Returns profile data. Requester must own the wallet address.
      operationId: userProfile
      x-status: current
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/walletAddress'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/user/{walletAddress}/preferences:
    get:
      tags: [User]
      summary: Get user app preferences
      operationId: userGetPreferences
      x-status: current
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/walletAddress'
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [User]
      summary: Update user app preferences
      operationId: userUpdatePreferences
      x-status: current
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/walletAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferencesUpdate'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ── Health ────────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        Standardized liveness probe. Returns 200 as long as the process is
        running and the event loop is responsive. Never touches the database or
        the Soroban RPC endpoint, so a degraded dependency cannot trigger a
        restart loop.

        Mounted ahead of the rate limiter and therefore never throttled.
      operationId: healthz
      x-status: current
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Standardized readiness probe. Verifies PostgreSQL connectivity
        (`SELECT 1`) and Soroban RPC connectivity (JSON-RPC `getHealth`) in
        parallel.

        Returns 200 with `status: ready` only when both dependencies report
        `up: true`; otherwise 503 with `status: not_ready`. The response body is
        identical in both cases, so a failing dependency can be identified from
        `checks.<name>.error`.
      operationId: readyz
      x-status: current
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/health:
    get:
      tags: [Health]
      summary: Liveness probe (v1)
      description: Returns 200 if the process is running. Does not check dependencies.
      operationId: healthV1
      x-status: deprecated
      x-replacement: GET /healthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/ready:
    get:
      tags: [Health]
      summary: Readiness probe (v1)
      description: |
        Returns 200 only when both the PostgreSQL database and Stellar Horizon
        are reachable. Returns 503 if either dependency is down.
      operationId: readyV1
      x-status: deprecated
      x-replacement: GET /readyz
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'

  /api/v2/health:
    get:
      tags: [Health]
      summary: Liveness probe (v2)
      description: Same as v1 but adds `uptime` and `apiVersion` fields.
      operationId: healthV2
      x-status: current
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HealthResponse'
                  - type: object
                    properties:
                      uptime:
                        type: number
                        description: Process uptime in seconds
                      apiVersion:
                        type: string
                        example: v2

  /api/v2/ready:
    get:
      tags: [Health]
      summary: Readiness probe (v2)
      operationId: readyV2
      x-status: current
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReadyResponse'
                  - type: object
                    properties:
                      apiVersion:
                        type: string
                        example: v2
        '503':
          description: One or more dependencies are unavailable

  # ── Stats ─────────────────────────────────────────────────────────────────
  /api/v1/stats/groups:
    get:
      tags: [Stats]
      summary: Platform-wide group statistics
      description: |
        Returns aggregated group statistics for the landing page.
        Sourced from the indexed ContractEvent database; cached 5 minutes in Redis.
      operationId: statsGroups
      x-status: current
      responses:
        '200':
          description: Group overview statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsOverviewStats'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Recommendations ───────────────────────────────────────────────────────
  /api/v1/recommendations/{userId}:
    get:
      tags: [Recommendations]
      summary: Get group recommendations for a user (v1)
      description: |
        Uses A/B testing to select between content-based and collaborative
        filtering algorithms. Bucket A → content-based; Bucket B → collaborative.
      operationId: recommendationsV1
      x-status: deprecated
      x-replacement: GET /api/v2/recommendations/{userId}
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'

  /api/v2/recommendations/{userId}:
    get:
      tags: [Recommendations]
      summary: Get group recommendations for a user (v2)
      description: Always uses collaborative filtering; returns richer metadata.
      operationId: recommendationsV2
      x-status: current
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RecommendationsResponse'
                  - type: object
                    properties:
                      apiVersion:
                        type: string
                        example: v2

  /api/v1/preferences:
    post:
      tags: [Recommendations]
      summary: Set user group preferences
      description: Stores user preference data used by the recommendation engine.
      operationId: setPreferences
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceInput'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Search ────────────────────────────────────────────────────────────────
  /api/v1/search:
    get:
      tags: [Search]
      summary: Global full-text search
      operationId: search
      x-status: current
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/search/autocomplete:
    get:
      tags: [Search]
      summary: Autocomplete suggestions
      operationId: searchAutocomplete
      x-status: current
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResults'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ── Analytics ─────────────────────────────────────────────────────────────
  /api/v1/analytics/platform:
    get:
      tags: [Analytics]
      summary: Platform statistics for a date
      operationId: analyticsPlatform
      x-status: current
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Target date (defaults to today)
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/analytics/platform/trends:
    get:
      tags: [Analytics]
      summary: Platform statistics trends over a date range
      operationId: analyticsPlatformTrends
      x-status: current
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Platform trends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTrends'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/analytics/users/{userId}:
    get:
      tags: [Analytics]
      summary: User-specific analytics
      operationId: analyticsUser
      x-status: current
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: User analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analytics/groups/{groupId}:
    get:
      tags: [Analytics]
      summary: Group-specific analytics
      operationId: analyticsGroup
      x-status: current
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Group analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analytics/events:
    get:
      tags: [Analytics]
      summary: Analytics event statistics
      operationId: analyticsEventsGet
      x-status: current
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Event statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsEventStat'
    post:
      tags: [Analytics]
      summary: Record an analytics event
      operationId: analyticsEventsPost
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsEventInput'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/analytics/reports:
    get:
      tags: [Analytics]
      summary: List analytics reports
      operationId: analyticsReportsGet
      x-status: current
      parameters:
        - name: reportType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Reports list
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsReport'
    post:
      tags: [Analytics]
      summary: Generate an analytics report
      operationId: analyticsReportsPost
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsReportInput'
      responses:
        '201':
          description: Report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/analytics/cache/stats:
    get:
      tags: [Analytics]
      summary: Analytics cache statistics
      operationId: analyticsCacheStats
      x-status: current
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'

  /api/v1/analytics/cache/clear:
    post:
      tags: [Analytics]
      summary: Clear analytics cache
      operationId: analyticsCacheClear
      x-status: current
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pattern:
                  type: string
                  description: Redis key pattern to clear (default "*")
                  example: "analytics:platform:*"
      responses:
        '200':
          description: Cache cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── Contract Events ───────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [Events]
      summary: Query indexed contract events
      operationId: eventsGet
      x-status: current
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
            enum: [GroupCreated, MemberJoined, ContributionMade, PayoutExecuted, GroupCompleted, GroupStatusChanged]
        - name: startLedger
          in: query
          schema:
            type: integer
        - name: endLedger
          in: query
          schema:
            type: integer
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated contract events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/events/stats:
    get:
      tags: [Events]
      summary: Contract event statistics
      operationId: eventsStats
      x-status: current
      parameters:
        - name: contractId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Event statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStats'

  # ── Export ────────────────────────────────────────────────────────────────
  /api/v1/export:
    post:
      tags: [Export]
      summary: Create a data export job
      operationId: exportCreate
      x-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email, format]
              properties:
                userId:
                  type: string
                email:
                  type: string
                  format: email
                format:
                  type: string
                  enum: [CSV, JSON]
      responses:
        '202':
          description: Export job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/export/{jobId}:
    get:
      tags: [Export]
      summary: Get export job status
      operationId: exportStatus
      x-status: current
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/export/{jobId}/download:
    get:
      tags: [Export]
      summary: Get download URL for a completed export
      operationId: exportDownload
      x-status: current
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: Job not completed yet
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/members/{address}/export.csv:
    get:
      tags: [Export]
      summary: Stream member contribution/payout history as CSV
      description: |
        Streams a CSV file containing all contributions and payouts for the
        given Stellar address. Suitable for tax and accounting purposes.
      operationId: memberExportCsv
      x-status: current
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Stellar wallet address
      responses:
        '200':
          description: CSV file stream
          content:
            text/csv:
              schema:
                type: string
                format: binary

  # ── Backup ────────────────────────────────────────────────────────────────
  /api/v1/backup:
    get:
      tags: [Backup]
      summary: List all backup jobs
      operationId: backupList
      x-status: current
      responses:
        '200':
          description: List of backup jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupJob'
    post:
      tags: [Backup]
      summary: Trigger a manual backup
      operationId: backupTrigger
