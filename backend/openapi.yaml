components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /api/auth/verify
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued by POST /api/v1/api-keys

  parameters:
    walletAddress:
      name: walletAddress
      in: path
      required: true
      schema:
        type: string
      description: Stellar public key (G... address)

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not authorised for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: v1
        responseTimeMs:
          type: number
        dependencies:
          type: object
          properties:
            database:
              type: object
              properties:
                up:
                  type: boolean
            horizon:
              type: object
              properties:
                up:
                  type: boolean

    ReadyResponse:
      allOf:
        - $ref: '#/components/schemas/HealthResponse'
        - type: object
          properties:
            status:
              type: string
              enum: [ready, not_ready]

    LivenessResponse:
      type: object
      required: [status, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        uptimeSeconds:
          type: number
          description: Process uptime in seconds
          example: 1834.21
        timestamp:
          type: string
          format: date-time

    DependencyStatus:
      type: object
      required: [up, latencyMs]
      properties:
        up:
          type: boolean
        latencyMs:
          type: integer
          description: Wall-clock duration of the probe
          example: 4
        error:
          type: string
          description: Present only when `up` is false
          example: 'connect ECONNREFUSED 127.0.0.1:5432'

    ReadinessResponse:
      type: object
      required: [status, responseTimeMs, timestamp, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        responseTimeMs:
          type: integer
          description: Total time spent running all dependency probes
          example: 12
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          required: [database, rpc]
          properties:
            database:
              $ref: '#/components/schemas/DependencyStatus'
            rpc:
              $ref: '#/components/schemas/DependencyStatus'

    UserProfile:
      type: object
      properties:
        walletAddress:
          type: string
        createdAt:
          type: string
          format: date-time

    UserPreferences:
      type: object
      properties:
