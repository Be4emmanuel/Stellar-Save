                  type: string
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sep31PaymentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Missing required compliance fields
        '502':
          description: Anchor service error

  /api/sep31/{id}/status:
    get:
      tags: [SEP-31]
