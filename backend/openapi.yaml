      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, proposer]
              properties:
                title:
                  type: string
                description:
                  type: string
                proposer:
                  type: string
                  description: Stellar address (must be a governor)
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/governance/proposals/{id}:
    get:
      tags: [Governance]
      summary: Get a single proposal
      operationId: governanceProposalGet
      x-status: current
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/governance/proposals/{id}/vote:
    post:
      tags: [Governance]
      summary: Cast a vote on a proposal (governors only)
      operationId: governanceVote
      x-status: current
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voter, support]
              properties:
                voter:
                  type: string
                  description: Stellar address (must be a governor)
                support:
                  type: boolean
                  description: true = for, false = against
      responses:
        '200':
          description: Updated proposal after vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already voted

  /api/v1/governance/governors:
    get:
      tags: [Governance]
      summary: List current governors
      operationId: governanceGovernors
