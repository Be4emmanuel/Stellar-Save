    put:
      tags: [Insurance]
      summary: Enable or update insurance settings
      operationId: insuranceUpdate
      x-status: current
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                premiumRate:
                  type: number
