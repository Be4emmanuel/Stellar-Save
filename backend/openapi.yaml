            schema:
              type: object
              required: [cid, groupId, contractId]
              properties:
                cid:
                  type: string
                groupId:
                  type: string
                contractId:
                  type: string
                priority:
                  type: integer
                  default: 0
      responses:
        '201':
          description: Pin job created
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ipfs/pins/{cid}:
    get:
      tags: [IPFS]
      summary: Check if a CID is pinned
      description: '**Internal-only**.'
      operationId: ipfsPinGet
      x-status: internal-only
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pin status
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid:
                    type: string
                  pinned:
                    type: boolean
                  accessCount:
                    type: integer
    delete:
      tags: [IPFS]
      summary: Unpin content by CID
      description: '**Internal-only**.'
      operationId: ipfsPinDelete
      x-status: internal-only
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, contractId]
              properties:
                groupId:
                  type: string
                contractId:
                  type: string
      responses:
        '200':
          description: Unpin job created

  /api/ipfs/pins/{cid}/retry:
    post:
      tags: [IPFS]
      summary: Retry a failed pin job
      description: '**Internal-only**.'
      operationId: ipfsPinRetry
      x-status: internal-only
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job retried
        '404':
          description: No failed job for this CID

  /api/ipfs/verify:
    post:
      tags: [IPFS]
      summary: Verify all pins
      description: '**Internal-only**.'
      operationId: ipfsVerify
      x-status: internal-only
      responses:
        '200':
          description: Verification result

  /api/ipfs/jobs:
    get:
      tags: [IPFS]
      summary: Get pinning job details or queue stats
      description: '**Internal-only**. Pass `jobId` to get a specific job.'
      operationId: ipfsJobs
      x-status: internal-only
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Job details or stats
        '404':
          description: Job not found

  /api/ipfs/groups/{groupId}/metadata:
    get:
      tags: [IPFS]
      summary: Get metadata pin status for a group
      description: '**Internal-only**.'
      operationId: ipfsGroupMetadata
      x-status: internal-only
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: contractId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata pin status
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ipfs/alerts:
    get:
      tags: [IPFS]
      summary: List IPFS monitor alerts
      description: '**Internal-only**.'
      operationId: ipfsAlerts
      x-status: internal-only
      parameters:
        - name: unacknowledgedOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Alerts

  /api/ipfs/alerts/{alertId}/acknowledge:
    post:
      tags: [IPFS]
      summary: Acknowledge an IPFS alert
      description: '**Internal-only**.'
      operationId: ipfsAlertAcknowledge
      x-status: internal-only
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Acknowledged
        '404':
          $ref: '#/components/responses/NotFound'

