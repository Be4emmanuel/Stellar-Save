[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/stellar-save",
    "contracts/guess-the-number",
    "contracts/nft-enumerable",
    "contracts/fungible-allowlist",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Xoulomon/Stellar-Save"

[workspace.dependencies]
soroban-sdk = "23.0.3"
stellar-save-common = { path = "contracts/common" }
stellar-access = "0.6.0"
stellar-macros = "0.6.0"
stellar-tokens = "0.6.0"
stellar-registry = "0.0.4"

[profile.release]
opt-level = "z"
# overflow-checks = true ensures integer arithmetic panics on overflow in WASM
# release builds, matching debug-build safety guarantees. This is critical for
# Soroban contracts because the default Rust release profile disables overflow
# checks; explicit opt-in here prevents silent wrapping on the Soroban WASM
# runtime. See: https://doc.rust-lang.org/cargo/reference/profiles.html
# Verified for issue #1718 — do NOT remove without a security review.
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
