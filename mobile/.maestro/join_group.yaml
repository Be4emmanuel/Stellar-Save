# Join a fixed fixture group independently of any other flow.
appId: com.stellarsave.mobile
---
- runFlow: setup.yaml
- tapOn:
    id: "groups-tab"
- tapOn:
    id: "group-card-1"
- extendedWaitUntil:
    visible:
      id: "group-preview"
    timeout: 10000
- assertVisible:
    text: "Lagos Ajo Circle"
- tapOn:
    id: "join-group-button"
- assertVisible:
    text: "Joined!"
