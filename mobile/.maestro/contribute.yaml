# Verifies the active-group fixture used by contribution flows.
# The current mobile app does not yet expose contribution actions.
appId: com.stellarsave.mobile
---
- runFlow: setup.yaml
- tapOn:
    id: "groups-tab"
- assertVisible:
    id: "group-card-1"
- assertVisible:
    text: "Lagos Ajo Circle"
- assertVisible:
    text: "Active"
