[package]
name = "stellar-save-common"
description = "Shared types reused across the Stellar-Save Soroban contracts"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Enable test-support utilities (create_env, generate_address).
# Sibling contracts activate this via their dev-dependencies entry.
testutils = ["soroban-sdk/testutils"]
